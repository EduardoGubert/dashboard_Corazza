version: '3.8'

services:
  # Servidor de Autenticação (Backend)
  auth-server:
    image: eduardogubert/dashboard-auth-server:latest
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - auth-data:/app/data
    networks:
      - dashboard-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # Dashboard Frontend
  dashboard:
    image: eduardogubert/dashboard-corazza:latest
    ports:
      - "80:80"
    networks:
      - dashboard-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  auth-data:
    driver: local

networks:
  dashboard-network:
    driver: overlay