version: '3.8'

services:
  # Servidor de Autenticação (Backend)
  auth-server:
    container_name: dashboard-auth-server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      # Persiste o banco de dados SQLite
      - auth-data:/app/data
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Dashboard Frontend
  dashboard:
    container_name: dashboard-corazza
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - REACT_APP_SUPABASE_URL=${REACT_APP_SUPABASE_URL}
        - REACT_APP_SUPABASE_ANON_KEY=${REACT_APP_SUPABASE_ANON_KEY}
        - REACT_APP_AUTH_API_URL=${REACT_APP_AUTH_API_URL}
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - dashboard-network
    depends_on:
      auth-server:
        condition: service_healthy

volumes:
  auth-data:
    driver: local

networks:
  dashboard-network:
    driver: bridge
