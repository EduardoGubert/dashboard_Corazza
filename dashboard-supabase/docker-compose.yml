version: '3.8'

services:
  # Servidor de Autenticação (Backend)
  auth-server:
    container_name: dashboard-auth-server
    image: eduardogubert/dashboard-auth-server:latest
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - auth-data:/app/data
    networks:
      - dashboard-network

  # Dashboard Frontend
  dashboard:
    container_name: dashboard-corazza
    image: eduardogubert/dashboard-corazza:latest
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - dashboard-network
    depends_on:
      - auth-server

volumes:
  auth-data:
    driver: local

networks:
  dashboard-network:
    driver: bridge